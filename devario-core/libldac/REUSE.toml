version = 1

[[annotations]]
path = [
    "PKGBUILD",
    "README.md",
    "keys/**",
    ".SRCINFO",
    ".gitignore",
    ".nvchecker.toml",
    "*.install",
    "*.sysusers",
    "*sysusers.conf",
    "*.tmpfiles",
    "*tmpfiles.conf",
    "*.logrotate",
    "*.pam",
    "*.service",
    "*.socket",
    "*.timer",
    "*.desktop",
    "*.hook",
]
SPDX-FileCopyrightText = "Arch Linux contributors"
SPDX-License-Identifier = "0BSD"

# Arch names Apache-2.0 for *.patch and vendors no text; LICENSES/Apache-2.0.txt is local.
[[annotations]]
path = [
    "*.patch",
]
SPDX-FileCopyrightText = "libldac contributors"
SPDX-License-Identifier = "Apache-2.0"
