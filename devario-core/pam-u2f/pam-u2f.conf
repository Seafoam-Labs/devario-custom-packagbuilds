# Drop-in for the polkit agent so it can reach U2F/FIDO2 hardware keys.
#
# The polkit agent runs in a sandbox that denies access to character devices.
# Without these overrides it cannot open a YubiKey, which breaks the
# second-factor prompt that pam_u2f relies on.
# Upstream tracking: https://github.com/polkit-org/polkit/issues/622
[Service]
ProtectHome=read-only
PrivateDevices=no
DeviceAllow=/dev/urandom r
DeviceAllow=char-hidraw rw
