# The 580 branch supports the proprietary kernel modules.
blacklist nouveau
blacklist nova_core
blacklist nova_drm
softdep nvidia post: nvidia-uvm nvidia-drm
options nvidia-drm modeset=1 fbdev=1

# Full VRAM preservation requires the suspend/resume services enabled by
# nvidia-580xx-utils.install. Use disk-backed storage for the VRAM image.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
